name: Build App Web

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.tsx"
      - "**/*.ts"
      - "app.json"
      - "babel.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static web app
        run: npx expo export --platform web

      - name: Deploy
        run: eas deploy --prod --non-interactive

